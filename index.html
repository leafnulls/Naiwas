<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奶蛙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #FCFFFE;
    }

    video {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  object-fit: cover;
  background: #FCFFFE;
}

@media (orientation: landscape) {
  video {
    width: auto;
    height: 100vh;
    height: 100dvh;
    max-width: 100vw;
    object-fit: contain;
    background:#FCFFFE;
  }
}

button {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 30px;
  width: 120px;
  height: 44px;
  border-radius: 20px;
  font-weight: 500;
  font-size:1em;
  background:black;
  color:white;
  border:none;
  opacity: 0.8;
  transform-origin: center center;
  transition:0.2s ease-out;

}

button:active{
    opacity: 0.4;
    transform: translateX(-50%) scale(0.95);
    
}

button:focus {
  outline: none;
}
  </style>
</head>
<body>
  <video id="myVideo" src="movie.mp4" autoplay playsinline loop></video>
  <button onclick = "playf()" id = "btn">播放</button>

  <script>
    const video = document.getElementById('myVideo');
    const btn = document.getElementById('btn');
    video.addEventListener('loadedmetadata', () => {
      if (video.paused) video.currentTime = 0.0001;
    });
    
    let is = true
    
    function playf(){
     if(is){
        video.play()
        is = false
        btn.innerText = "暂停"
       }else{
       video.pause()
           is = true
        btn.innerText = "播放"
        }
    }
    
  </script>
</body>
</html>
